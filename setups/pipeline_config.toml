[pipeline]
run_mode = "deidentification" # full | sam3 | postprocess | deidentification | report

input_path = "imgs/sam3_processed_panoramic/imgs"
output_json = "artifacts/panoramic/results.json"
# Pipeline output lives outside imgs/, which is the (gitignored) INPUT tree.
artifacts_dir = "artifacts/panoramic"
save_artifacts = true # set to false in production to skip intermediate image files
prompt = "rectangular panoramic scan"
fallback_prompt = "" # second SAM3 prompt tried when no boxes found on first pass; leave empty to skip

kernel_size = 9
iterations = 5
large_bb_area_ratio = 0.1

# ── OCR engine ───────────────────────────────────────────────────────────────
# easyocr | paddleocr | rapidocr | onnxtr | surya | vlm | ensemble
#
# onnxtr won on both modalities (see thesis/thesis_data_out/ocr_benchmarks).
# Paired with the settings below it reaches 0.795 coverage recall on panoramic
# and 0.947 on teleradiography, against 0.740 and 0.887 for the previous
# easyocr default. It also matches a three-engine ensemble exactly while making
# 28% fewer predictions and roughly halving the false-positive rate -- the
# ensemble turned out to add nothing here, because every engine's detections
# are a nested subset of the others'.
ocr_engine = "onnxtr"
easyocr_langs = ["en", "it"]
easyocr_gpu = true # falls back to CPU with a warning when no GPU is usable
save_deidentified_dir = ""

# Minimum per-detection confidence; detections below are discarded (0.0 = keep all)
ocr_min_confidence = 0.0
# EasyOCR readtext tuning (defaults match previous hardcoded values)
easyocr_text_threshold = 0.5
easyocr_low_text = 0.4
easyocr_link_threshold = 0.4
easyocr_canvas_size = 4000 # images with a longer side are downscaled internally
easyocr_mag_ratio = 1.0

# PaddleOCR PP-OCRv5 (used when ocr_engine = "paddleocr"; needs the paddle extra)
paddleocr_device = "gpu" # cpu | gpu — falls back to cpu at runtime when no GPU is usable
paddleocr_det_model = "PP-OCRv5_mobile_det"
paddleocr_rec_model = "PP-OCRv5_mobile_rec"

# ── RapidOCR: the same PP-OCR DB detector over ONNX Runtime ─────────────────
# Preferred over paddleocr on GPU hosts: no paddlepaddle, which ships no sm_120
# wheels and so cannot use a Blackwell card at all. Needs the 'rapidocr' extra.
# NOTE: the official onnxruntime-gpu wheels also lack sm_120 kernels, so on an
# RTX 5000 this silently runs on CPU — the builder logs the available providers.
rapidocr_device = "gpu" # cpu | gpu
# Detection thresholds, which the paddleocr adapter hard-codes away. These are
# the cheapest recall levers here; the defaults below are deliberately looser
# than the library's, because over-redaction is cheap and a miss leaks PHI.
rapidocr_text_score = 0.3       # library default 0.5
rapidocr_box_thresh = 0.3       # library default 0.5 — box acceptance
rapidocr_thresh = 0.2           # library default 0.3 — pixel binarisation
rapidocr_unclip_ratio = 2.0     # library default 1.6 — inflates every polygon
rapidocr_limit_side_len = 2560  # library default ~736 would crush a panoramic
rapidocr_use_rec = true         # false = detection only, much faster, text = ""

# ── OnnxTR: DBNet / ResNet-50, same runtime, different backbone ─────────────
# Different training set from PP-OCR, so its errors decorrelate — which is the
# point of putting both in the ensemble. Needs the 'onnxtr' extra.
onnxtr_device = "gpu" # cpu | gpu
onnxtr_arch = "db_resnet50"
onnxtr_bin_thresh = 0.2    # library default 0.3
onnxtr_box_thresh = 0.05   # library default 0.1
onnxtr_unclip_ratio = 2.0  # library default 1.5

# ── Surya: needs its own venv (pins pillow<11 and an exact opencv) ──────────
surya_device = "cuda" # cpu | cuda
surya_min_confidence = 0.0

# ── VLM over any OpenAI-compatible endpoint ─────────────────────────────────
# Hosted API, or a locally served model (see the vllm-* services in
# docker-compose.yml). Grounding coordinates are known to drift between runs
# and a box 20px off leaks PHI, so use a VLM as an ensemble member that boosts
# recall, not as the only source of geometry — and characterise its output with
# test/probe_vlm_grounding.py before trusting vlm_coord_space.
vlm_model = "gpt-5.4-mini"
vlm_base_url = ""            # empty = hosted OpenAI; e.g. "http://vllm-glm-ocr:8000/v1"
vlm_api_key_env = "OPENAI_API_KEY"
vlm_prompt = ""              # empty = the built-in prompt for vlm_response_format
vlm_response_format = "json" # json | deepseek_grounding
vlm_coord_space = ""         # empty = the format's default; pixel | normalized_999 | normalized_1
vlm_box_dilate_px = 24       # extra slack absorbing grounding drift
vlm_max_side_px = 2048
vlm_timeout_s = 120.0
vlm_confidence = 1.0

# ── Ensemble: union of several engines' detections ──────────────────────────
# The union-find merge collapses the boxes members agree on. Keep
# ocr_min_confidence at 0.0 and use the per-member floors instead: a
# recognition softmax, a detector box score and a constant are not comparable,
# so one global threshold mutes whichever member scores conservatively.
ensemble_engines = []         # e.g. ["easyocr", "rapidocr", "onnxtr"]
ensemble_min_confidences = [] # same length as ensemble_engines, or empty
ensemble_fail_mode = "warn"   # warn (skip a failing member) | raise

# ── OCR preprocessing (applied to the OCR input only, never to the output) ──
# Ordered subset of ["grayscale", "clahe", "invert", "tophat", "blackhat",
# "percentile_stretch", "gamma", "unsharp"]. Every step must preserve the image
# dimensions -- scaling lives in ocr_upscale_factor below, because the box
# coordinates and the ellipse test are measured in this image's space.
# Gentle CLAHE, deliberately: clip 20/32px and clip 40/16px both score better
# on the handful of hardest images and worse overall, roughly doubling the
# detections and fragmenting text lines into pieces that each cover only part
# of a box (teleradiography full-coverage drops 0.714 -> 0.564).
preprocess_steps = ["grayscale", "clahe"]

# Several independent chains; the engine runs once per chain and the detections
# are unioned. One model, N passes -- the cheapest recall lever available.
# Empty = just use preprocess_steps. Example:
#   preprocess_variants = [[], ["grayscale", "clahe"], ["grayscale", "tophat"]]
preprocess_variants = []

clahe_clip_limit = 2.0
# Target CLAHE tile edge in pixels; the grid is derived per image. The dataset
# spans 512x248 to 6343x2713, so the old fixed grid below meant 64px tiles on
# one image and 793px on another -- effectively global equalisation against a
# 14px-tall median text box. Set clahe_tile_px = 0 to use the fixed grid.
clahe_tile_px = 128
clahe_tile_grid_size = 8

morph_kernel_px = 21 # tophat/blackhat kernel; should exceed the text stroke width
stretch_low_pct = 1.0
stretch_high_pct = 99.0
preprocess_gamma = 0.5
unsharp_sigma = 2.0
unsharp_amount = 1.5

ocr_dual_pass_invert = false # also OCR the inverted image and union detections

# Enlarges the OCR input and maps the boxes back, so small low-contrast text is
# seen at higher resolution. Composes with resolution_strategy = "tiled".
# With easyocr, raise easyocr_canvas_size too or it downscales the gain away.
ocr_upscale_factor = 1.0
ocr_upscale_interpolation = "cubic" # cubic | lanczos | linear | nearest

# ── Resolution strategy ──────────────────────────────────────────────────────
resolution_strategy = "full" # full | tiled
tile_size_px = 1600
tile_overlap_px = 200 # must exceed the tallest expected text line
tile_dedupe_iou = 0.5 # containment ratio for cross-tile duplicate merging

# ── Text filter (which detections get redacted) ──────────────────────────────
text_filter = "none" # none | short_text (skip detections <= short_text_max_chars)
short_text_max_chars = 2

# ── Redaction output ─────────────────────────────────────────────────────────
redaction_mode = "fill" # fill (real anonymization) | outline (debug boxes only:
                        # draws rectangles and leaves the PHI readable underneath)
record_raw_detections = false # also store raw + skipped detections in records.json

merge_distance_px = 10

# Reject "the engine returned the whole image". Measured against the ground
# truth, the absolute cap alone discards 13 of 136 real teleradiography text
# regions, so prefer the relative one (fraction of image area; 0 = disabled).
max_box_area_px = 0       # disabled in favour of the relative cap below
max_box_area_ratio = 0.25

# Central keep-out zone: detections overlapping it are dropped, to stop the OCR
# hallucinating on tooth shapes. The half-axes are fractions of the FULL width
# and height, so 0.45/0.35 spans 5%-95% horizontally and 15%-85% vertically --
# nearly the whole image. Measured cost of that setting: 8 of 81 panoramic and
# 16 of 136 teleradiography GT text boxes are discarded before OCR can find
# them. See the ellipse ablation in setups/benchmark_matrix.toml.
ellipse_enabled = true
ellipse_axis_x_ratio = 0.35
ellipse_axis_y_ratio = 0.25
ellipse_proximity_px = 0.0
deid_padding_px = 20 # recall insurance; costs ~0.5pt of image area vs 10px
