# Sweep specification for test/benchmark_deid.py.
#
# Ground truth is annotated directly on the images each [[dataset]] points at
# (verified: every GT coordinate falls inside its corresponding file). The sweep
# therefore needs neither a GPU nor a SAM3/postprocess rerun — the postprocess
# records are synthesised from a directory listing.
#
# Do NOT regenerate crops with test/run_postprocess_detached.py and point this
# at them: that stage rotates and crops, which invalidates the annotations.
#
# Each [[variant]] holds config overrides applied on top of
# setups/pipeline_config.toml [pipeline]; a variant with only a name runs the
# current defaults (baseline).

[base]
margin_px = 5.0
iou_threshold = 0.5
min_gt_side_px = 1.0 # drops one 27.0 x 0.029 px teleradiography annotation slip
out_root = "thesis/thesis_data_out/ocr_benchmarks"

[[dataset]]
name = "panoramic"
images_dir = "imgs/sam3_processed_panoramic/imgs"
ground_truth = "imgs/sam3_processed_panoramic/test_dataset_text_groundtruth.json"

[[dataset]]
name = "teleradiography"
images_dir = "imgs/teleradiography_with_text"
ground_truth = "imgs/teleradiography_with_text/groundtruth.json"
# 33 of the 99 images have no GT entry. images_dir makes them count as clean
# (so they contribute to clean_image_fp_rate) rather than vanishing entirely;
# if any of them actually do contain unannotated text, that rate is pessimistic.

# ── The number everything else is measured against ──────────────────────────
[[variant]]
name = "baseline_easyocr"

# ── Recall ceilings imposed by the geometric filters ────────────────────────
# Measured against the ground truth: the central ellipse alone discards 8/81
# panoramic and 16/136 teleradiography GT boxes, and max_box_area_px discards a
# further 13/136 teleradiography boxes — before OCR is even involved.
[[variant]]
name = "no_ellipse"
ellipse_enabled = false

[[variant]]
name = "ellipse_035_025"
ellipse_axis_x_ratio = 0.35
ellipse_axis_y_ratio = 0.25

[[variant]]
name = "no_area_cap"
max_box_area_px = 0

[[variant]]
name = "no_ellipse_no_area_cap"
ellipse_enabled = false
max_box_area_px = 0

[[variant]]
name = "area_ratio_025"
max_box_area_px = 0
max_box_area_ratio = 0.25

# ── Redaction padding: recall insurance vs over-redaction cost ──────────────
[[variant]]
name = "pad20"
deid_padding_px = 20

[[variant]]
name = "pad30"
deid_padding_px = 30

# ── Preprocessing, aimed at the low-contrast failure mode ───────────────────
[[variant]]
name = "clahe"
preprocess_steps = ["grayscale", "clahe"]

[[variant]]
name = "clahe_fixed_grid"
preprocess_steps = ["grayscale", "clahe"]
clahe_tile_px = 0 # the old fixed 8x8 grid, for comparison

[[variant]]
name = "clahe_clip4"
preprocess_steps = ["grayscale", "clahe"]
clahe_clip_limit = 4.0

[[variant]]
name = "tophat"
preprocess_steps = ["grayscale", "tophat", "percentile_stretch"]

[[variant]]
name = "stretch"
preprocess_steps = ["grayscale", "percentile_stretch"]

[[variant]]
name = "gamma"
preprocess_steps = ["grayscale", "gamma"]

[[variant]]
name = "unsharp"
preprocess_steps = ["grayscale", "unsharp"]

[[variant]]
name = "dual_pass_invert"
ocr_dual_pass_invert = true

# Preprocessing ensemble: one model, several chains, detections unioned.
[[variant]]
name = "preprocess_ensemble"
preprocess_variants = [
    [],
    ["grayscale", "clahe"],
    ["grayscale", "tophat", "percentile_stretch"],
]

# ── Resolution ──────────────────────────────────────────────────────────────
[[variant]]
name = "tiled"
resolution_strategy = "tiled"

[[variant]]
name = "upscale2x"
ocr_upscale_factor = 2.0
easyocr_canvas_size = 8000 # else EasyOCR downscales the upscale straight back

# ── Detection thresholds / filters ──────────────────────────────────────────
[[variant]]
name = "easyocr_low_thresholds"
easyocr_text_threshold = 0.3
easyocr_low_text = 0.25
easyocr_link_threshold = 0.25

[[variant]]
name = "conf02"
ocr_min_confidence = 0.2

[[variant]]
name = "short_text"
text_filter = "short_text"

# ── Candidate shipping configuration ────────────────────────────────────────
[[variant]]
name = "recall_max"
ellipse_axis_x_ratio = 0.35
ellipse_axis_y_ratio = 0.25
max_box_area_px = 0
max_box_area_ratio = 0.25
deid_padding_px = 20
ocr_dual_pass_invert = true
preprocess_variants = [
    [],
    ["grayscale", "clahe"],
    ["grayscale", "tophat", "percentile_stretch"],
]

# ── Alternative detectors ───────────────────────────────────────────────────
# RapidOCR runs the PP-OCRv6 DB detector over ONNX Runtime (no paddlepaddle, so
# it is not blocked by the missing sm_120 wheels). OnnxTR is DBNet/ResNet-50 —
# same runtime, different backbone and training set, so its errors decorrelate.
[[variant]]
name = "rapidocr"
ocr_engine = "rapidocr"

[[variant]]
name = "rapidocr_loose"
ocr_engine = "rapidocr"
rapidocr_box_thresh = 0.15
rapidocr_thresh = 0.15
rapidocr_unclip_ratio = 2.5

[[variant]]
name = "onnxtr"
ocr_engine = "onnxtr"

# OnnxTR is the cheapest engine here (~1.4 s/image on CPU), so the
# preprocessing hypothesis is tested against it rather than against EasyOCR.
[[variant]]
name = "onnxtr_clahe"
ocr_engine = "onnxtr"
preprocess_steps = ["grayscale", "clahe"]

[[variant]]
name = "onnxtr_tophat"
ocr_engine = "onnxtr"
preprocess_steps = ["grayscale", "tophat", "percentile_stretch"]

[[variant]]
name = "onnxtr_upscale2x"
ocr_engine = "onnxtr"
ocr_upscale_factor = 2.0

[[variant]]
name = "onnxtr_preprocess_ensemble"
ocr_engine = "onnxtr"
preprocess_variants = [
    [],
    ["grayscale", "clahe"],
    ["grayscale", "tophat", "percentile_stretch"],
]

# ── Ensemble: the union of three architectures (CRAFT, PP-OCR DB, DBNet/R50) ─
[[variant]]
name = "ensemble_geo3"
ocr_engine = "ensemble"
ensemble_engines = ["easyocr", "rapidocr", "onnxtr"]

[[variant]]
name = "ensemble_geo3_recall_max"
ocr_engine = "ensemble"
ensemble_engines = ["easyocr", "rapidocr", "onnxtr"]
ellipse_axis_x_ratio = 0.35
ellipse_axis_y_ratio = 0.25
max_box_area_px = 0
max_box_area_ratio = 0.25
deid_padding_px = 20
