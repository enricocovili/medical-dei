# Medical image de-identification pipeline — Docker Compose
#
# REQUIREMENTS
#   • Docker Engine 24+ with Compose V2 plugin
#   • NVIDIA Container Toolkit (nvidia-docker2) installed on the host
#   • CUDA 12.8+ drivers on the host GPU (required for Blackwell/RTX 5000 sm_120)
#   • A Hugging Face account with access to the SAM3 model weights
#
# FIRST-TIME SETUP
#   1. Export your Hugging Face token:
#        export HF_TOKEN=hf_xxxxxxxxxxxxxxxxxx
#      (or create a .env file in this directory: HF_TOKEN=hf_xxx)
#
#   2. Place input images in ./imgs/input/  (or adjust input_path in the config)
#
#   3. Build the image (one-time, ~10–20 min due to torch + SAM3):
#        docker compose build
#
#   4. Run the pipeline:
#        docker compose run --rm pipeline
#
# COMMON COMMANDS
#   Run a specific stage (set run_mode in setups/pipeline_config.toml first):
#     docker compose run --rm pipeline python pipeline/app.py
#
#   Run accuracy test against a ground-truth file:
#     docker compose run --rm pipeline python test/test_accuracy.py \
#       --predictions imgs/output/deidentification/records.json \
#       --ground-truth imgs/test_dataset_text_groundtruth.json --per-image
#
#   Open a shell inside the container:
#     docker compose run --rm pipeline bash

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    # ── GPU access ─────────────────────────────────────────────────────────
    # Requires the NVIDIA Container Toolkit on the host.
    # Remove this block to run CPU-only (SAM3 and EasyOCR will be very slow).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # expose all available GPUs; set to 1 for single-GPU
              capabilities: [gpu]

    # ── Environment variables ──────────────────────────────────────────────
    # Docker creates a missing bind-mount source as root. Running as the host
    # user keeps thesis/thesis_data_out writable from the host afterwards.
    user: "${UID:-1000}:${GID:-1000}"

    environment:
      # Hugging Face access token — required for SAM3 model weights download on
      # the first run. Set in shell or in a .env file alongside docker-compose.yml.
      - HF_TOKEN=${HF_TOKEN:-}

      # EasyOCR stores downloaded OCR models here; mapped to a named volume below
      # so they are not re-downloaded on every `docker compose run`.
      - EASYOCR_MODULE_PATH=/cache/easyocr

    # ── Volume mounts ──────────────────────────────────────────────────────
    volumes:
      # Input images and output artifacts.
      # The pipeline reads from input_path and writes to artifacts_dir;
      # both are configured in setups/pipeline_config.toml and default to
      # subdirectories of imgs/.
      - ./imgs:/app/imgs

      # Pipeline config (read-only inside the container so edits happen on host).
      # Change run_mode, OCR settings, ellipse exclusion zone, etc. without
      # rebuilding the image.
      - ./setups/pipeline_config.toml:/app/setups/pipeline_config.toml:ro

      # SAM3 model weights downloaded from Hugging Face.
      # Persisted in a named volume to avoid re-downloading between runs.
      - hf-model-cache:/root/.cache/huggingface

      # EasyOCR model weights (craft, detection, recognition).
      # Persisted in a named volume; path matches EASYOCR_MODULE_PATH above.
      - easyocr-model-cache:/cache/easyocr

      # PaddleOCR (PP-OCRv5) model weights, downloaded on first paddle run.
      - paddlex-model-cache:/root/.paddlex

      # RapidOCR (PP-OCRv6 ONNX) and OnnxTR (DBNet) weights.
      - rapidocr-model-cache:/root/.rapidocr
      - onnxtr-model-cache:/root/.cache/onnxtr

      # Test/benchmark scripts and benchmark outputs; mounted so harness edits
      # and sweep results don't require image rebuilds.
      - ./test:/app/test
      - ./thesis/thesis_data_out:/app/thesis/thesis_data_out

    # Default command (matches Dockerfile CMD); override on the CLI as needed.
    command: ["python", "pipeline/app.py", "--verbose"]

  # ── VLM OCR backends ───────────────────────────────────────────────────────
  # Each model gets its own container because their dependencies are mutually
  # unsatisfiable: DeepSeek-OCR-2 pins torch==2.6.0 (which predates sm_120, so
  # it cannot run on a Blackwell card at all) and transformers==4.46.3, while
  # GLM-OCR needs transformers>=5.3.0. Behind an OpenAI-compatible HTTP API
  # they coexist, the pipeline image gains no dependencies, and the model stays
  # resident across benchmark variants instead of reloading per run.
  #
  # Start one at a time (they each want the whole GPU):
  #     docker compose up -d vllm-deepseek-ocr2
  #     docker compose run --rm pipeline python test/probe_vlm_grounding.py \
  #         --base-url http://vllm-deepseek-ocr2:8000/v1 \
  #         --model deepseek-ocr2 --image imgs/sam3_processed_panoramic/imgs/<x>.jpg
  #
  # Then point the pipeline at it in setups/pipeline_config.toml:
  #     ocr_engine = "vlm"
  #     vlm_base_url = "http://vllm-deepseek-ocr2:8000/v1"
  #     vlm_model = "deepseek-ocr2"
  #     vlm_response_format = "deepseek_grounding"
  # ...but verify vlm_coord_space with probe_vlm_grounding.py first: published
  # reviews report VLM grounding coordinates drifting between runs, and a box
  # 20px off leaks PHI.

  vllm-deepseek-ocr2:
    image: vllm/vllm-openai:latest
    profiles: ["vlm"]
    ports: ["8000:8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model deepseek-ai/DeepSeek-OCR-2
      --served-model-name deepseek-ocr2
      --trust-remote-code
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --max-model-len 8192

  vllm-glm-ocr:
    image: vllm/vllm-openai:latest
    profiles: ["vlm"]
    ports: ["8001:8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # ~4.5 GB of weights; the bbox output format is undocumented everywhere, so
    # characterise it with test/probe_vlm_grounding.py before wiring a parser.
    command: >
      --model zai-org/GLM-OCR
      --served-model-name glm-ocr
      --trust-remote-code
      --max-model-len 8192
      --gpu-memory-utilization 0.5

  vllm-paddleocr-vl:
    image: vllm/vllm-openai:latest
    profiles: ["vlm"]
    ports: ["8002:8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # 0.9B, Apache-2.0, and its text-spotting head emits 4-point quadrilaterals,
    # which map 1:1 onto OcrDetection.quad — the best-documented grounding of
    # the three, so try this one first.
    command: >
      --model PaddlePaddle/PaddleOCR-VL
      --served-model-name paddleocr-vl
      --trust-remote-code
      --max-model-len 8192


# ── Named volumes ──────────────────────────────────────────────────────────
# Docker manages these directories; they survive container removal.
# To reset the model cache (force re-download):
#   docker compose down -v
volumes:
  hf-model-cache:
  easyocr-model-cache:
  paddlex-model-cache:
  rapidocr-model-cache:
  onnxtr-model-cache:
  vllm-model-cache:
